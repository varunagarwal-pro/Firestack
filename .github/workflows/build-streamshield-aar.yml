name: Build StreamShield Firestack AAR

on:
  push:
    branches:
      - streamshield
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 📦 Build Firestack AAR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: 🚀 Compile AAR via make-aar
        run: |
          ./make-aar nogo debug
        shell: bash

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firestack-streamshield-aar
          path: |
            firestack.aar
            firestack-sources.jar
            firestack-debug-symbols.zip

      - name: 🏷️ Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${SHORT_SHA}"
          echo "Publishing release for tag: ${TAG}"
          gh release create "${TAG}" firestack.aar firestack-sources.jar firestack-debug-symbols.zip \
            --target "${GITHUB_SHA}" \
            --title "StreamShield Firestack ${TAG}" \
            --notes "StreamShield Sovereign Firestack AAR (${SHORT_SHA}) with 10 video stall, proxy timeout, and TCP keepalive fixes." || \
          gh release upload "${TAG}" firestack.aar firestack-sources.jar firestack-debug-symbols.zip --clobber
        shell: bash
